<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #1d4ed8 0%, transparent 45%),
                  radial-gradient(circle at 80% 10%, #7c3aed 0%, transparent 35%),
                  linear-gradient(135deg, var(--bg-1), var(--bg-2));
      padding: 24px;
    }

    .container {
      width: min(780px, 100%);
      padding: 28px;
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 16px 40px rgba(2, 6, 23, 0.45);
      animation: card-enter 700ms ease-out;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 2.5vw, 2.3rem);
      letter-spacing: 0.4px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1rem;
    }

    ul {
      margin: 0 0 22px;
      padding-left: 22px;
      line-height: 1.9;
      font-size: 1.05rem;
    }

    li {
      opacity: 0;
      transform: translateY(10px);
      animation: item-in 500ms ease forwards;
    }

    li:nth-child(1) { animation-delay: 120ms; }
    li:nth-child(2) { animation-delay: 220ms; }
    li:nth-child(3) { animation-delay: 320ms; }

    .actions {
      display: flex;
      justify-content: flex-start;
    }

    button {
      border: 0;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.25);
      transition: transform 200ms ease, box-shadow 200ms ease, filter 200ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(167, 139, 250, 0.35);
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(0);
    }

    .is-refreshing li {
      animation: item-swap 450ms ease;
    }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes item-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes item-swap {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Генератор идей для постов</h1>
    <p class="subtitle">Нажми кнопку, чтобы получить новую подборку контента.</p>
    <ul id="ideasList">
      <li>5 идей для постов для экспертов</li>
      <li>3 идеи сторис на сегодня</li>
      <li>Контент план на неделю</li>
    </ul>
    <div class="actions">
      <button id="generateBtn" type="button">Сгенерировать</button>
    </div>
  </main>

  <script>
    const ideasByCategory = [
      [
        "5 идей для постов для экспертов",
        "3 идеи сторис на сегодня",
        "Контент план на неделю"
      ],
      [
        "7 тем для экспертных постов в блоге",
        "4 быстрые идеи сторис для вовлечения",
        "План публикаций на 7 дней"
      ],
      [
        "5 постов с личными кейсами и выводами",
        "3 сторис с опросами для аудитории",
        "Контент-план на неделю по рубрикам"
      ],
      [
        "6 экспертных постов: советы и инструменты",
        "3 идеи сторис: бэкстейдж, вопрос, отзыв",
        "План контента на неделю с CTA"
      ]
    ];

    const list = document.getElementById("ideasList");
    const button = document.getElementById("generateBtn");

    button.addEventListener("click", () => {
      const current = Array.from(list.children).map((li) => li.textContent);
      let next = ideasByCategory[Math.floor(Math.random() * ideasByCategory.length)];

      while (next.join("|") === current.join("|")) {
        next = ideasByCategory[Math.floor(Math.random() * ideasByCategory.length)];
      }

      list.classList.remove("is-refreshing");
      void list.offsetWidth;
      list.classList.add("is-refreshing");

      Array.from(list.children).forEach((li, idx) => {
        li.textContent = next[idx];
      });
    });
  </script>
</body>
</html>
